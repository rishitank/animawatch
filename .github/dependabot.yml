# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: Reviewers are automatically assigned via CODEOWNERS

version: 2
updates:
  # Python dependencies (pip/uv)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'automated'
    # pyproject.toml uses unpinned '>=' ranges, so Dependabot opens "update requirement"
    # PRs that carry no update-type; groups filtered by update-types never match them and
    # every bump used to arrive as its own PR. Group by pattern only.
    groups:
      dev-dependencies:
        patterns:
          - 'pytest*'
          - 'ruff'
          - 'mypy'
          - 'pip-audit'
          - 'types-*'
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'pytest*'
          - 'ruff'
          - 'mypy'
          - 'pip-audit'
          - 'types-*'
      security-updates:
        applies-to: 'security-updates'
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - 'dependencies'
      - 'ci'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'

