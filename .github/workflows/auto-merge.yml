name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    # Don't run on draft PRs, forked PRs or dependency-bot PRs. Renovate decides
    # per update whether to automerge (see renovate.json and the shared preset), and
    # enabling auto-merge here would override that policy, e.g. for major bumps.
    # PRs opened by a human account (including agent PRs) are skipped too: the
    # owner merges those. The review-gate ruleset counts a CodeRabbit approval as
    # the required review, so arming them here would merge them the moment
    # CodeRabbit approved. Other bot PRs (e.g. the release PR) still need the
    # owner's approval, because CodeRabbit skips bot PRs.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Enable auto-merge (squash)
        # Using PAT instead of GITHUB_TOKEN so that the merge triggers the 'closed' event
        # for other workflows (GITHUB_TOKEN actions don't trigger subsequent workflows)
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.PAT_AUTO_MERGE }}
